<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Class List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-input [(ngModel)]="className" placeholder="Enter class name"></ion-input>
  <ion-button expand="full" (click)="addClass()">Add Class</ion-button>

  <ion-list>
    <ion-item *ngFor="let cls of classes">
      <ion-label (click)="goToSubjects(cls.id)">
        {{ cls.name }}
      </ion-label>

      <ion-button fill="clear" color="primary" (click)="editClass(cls)">
        Edit
      </ion-button>
      <ion-button fill="clear" color="danger" (click)="deleteClass(cls.id)">
        Delete
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
